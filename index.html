<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>麻雀共有ルーム・ログイン転送</title>
<style>body{font:16px/1.6 system-ui,-apple-system,sans-serif;max-width:560px;margin:0 auto;padding:32px 18px;color:#243047}a{color:#245cce}.note{background:#f0f4fc;border-radius:12px;padding:16px}</style>
</head>
<body>
<h1 style="font-size:21px">麻雀共有ルーム</h1>
<div class="note" id="status">ログイン後の移動先を確認しています。</div>
<p><a href="/mahjong-room-dev/">開発用サイトを開く</a></p>
<script>
(function(){
  // Only route known Supabase auth response fragments, never arbitrary paths or destinations.
  const hash=window.location.hash||'';
  const search=window.location.search||'';
  const authFragment=/^#(?:access_token=|error=|error_code=)/.test(hash);
  const authQuery=/^[?&](?:code=|error=|error_code=)/.test(search);
  if(authFragment||authQuery){
    // Same-origin relative path: no auth credentials are sent to a third-party host.
    window.location.replace('/mahjong-room-dev/'+search+hash);
  }else{
    document.getElementById('status').textContent='このページはログイン用の転送先です。開発用サイトは下のリンクから開けます。';
  }
})();
</script>
</body></html>
